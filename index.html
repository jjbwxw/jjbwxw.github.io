<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>jjbwxw 的主页</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1e3a5f 0%, #2d6a9f 100%);
      color: #fff;
      padding: 20px;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      max-width: 420px;
      width: 100%;
    }
    .avatar {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: #fff;
      color: #1e3a5f;
      font-size: 40px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    h1 { font-size: 26px; margin-bottom: 8px; }
    .subtitle { opacity: 0.8; font-size: 15px; margin-bottom: 28px; }
    .links a {
      display: inline-block;
      margin: 6px 10px;
      padding: 10px 22px;
      border-radius: 999px;
      background: #fff;
      color: #1e3a5f;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      transition: transform 0.15s ease;
    }
    .links a:hover { transform: translateY(-2px); }
    footer { margin-top: 28px; font-size: 12px; opacity: 0.6; }
  </style>
</head>
<body>
  <div class="card">
    <div class="avatar">J</div>
    <h1>jjbwxw</h1>
    <p class="subtitle">这里是我的个人主页，欢迎来看看</p>
    <div class="links">
      <a href="https://github.com/jjbwxw" target="_blank" rel="noopener">GitHub</a>
    </div>
    <footer>Powered by GitHub Pages</footer>
  </div>
</body>
</html>
