<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f4f6f3">
  <meta name="description" content="jjbwxw 的个人博客、项目记录与文件下载。">
  <title>jjbwxw — 随手记</title>
  <style>
    /* SECTION: tokens */
    :root {
      color-scheme: light;
      --paper: #f4f6f3;
      --surface: #ffffff;
      --ink: #20332f;
      --ink-2: #596962;
      --muted: #616e67;
      --line: rgba(32, 51, 47, 0.09);
      --line-strong: rgba(32, 51, 47, 0.16);
      --green: #176b52;
      --sans: "Segoe UI", "Microsoft YaHei", sans-serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --ease: cubic-bezier(0.2, 0, 0.2, 1);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.7;
    }
    a { color: inherit; }
    a:focus-visible { outline: 2px solid var(--green); outline-offset: 3px; }

    /* SECTION: header */
    .site-line { height: 4px; background: var(--green); }
    .shell { max-width: 1056px; margin: 0 auto; padding: 0 32px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 24px 0;
      border-bottom: 1px solid var(--line);
    }
    .brand { font: 500 18px/1 var(--mono); text-decoration: none; }
    .brand span { color: var(--green); }
    nav { display: flex; align-items: center; gap: 24px; font-size: 14px; color: var(--ink-2); }
    nav a {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      text-decoration: none;
      transition: color 0.16s var(--ease);
    }
    nav a:hover, .text-link:hover { color: var(--green); }
    .ext { width: 14px; height: 14px; stroke: currentColor; stroke-width: 1.5; fill: none; flex: none; }

    /* SECTION: layout */
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 72px;
      padding: 60px 0 88px;
    }
    .eyebrow { margin: 0; font: 400 12px var(--mono); color: var(--muted); }
    h1 {
      margin: 12px 0 8px;
      font: 500 clamp(36px, 5.5vw, 56px)/1.15 var(--serif);
    }
    .intro { max-width: 44ch; margin: 16px 0 48px; color: var(--ink-2); font-size: 16px; }

    /* SECTION: sections */
    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
    }
    h2 { margin: 0; font: 500 22px var(--serif); }
    .section-note { color: var(--muted); font: 400 12px var(--mono); }
    .empty {
      margin-top: 20px;
      padding: 24px;
      background: var(--surface);
      border: 1px solid var(--line);
    }
    .empty p { margin: 0; color: var(--ink-2); font-size: 14px; }
    .empty .small { margin-top: 8px; color: var(--muted); font-size: 13px; }
    .download { margin-top: 48px; }

    /* SECTION: dynamic file list states */
    .files-state {
      margin-top: 12px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 14px;
    }
    .files-state .text-link { margin-left: 4px; }

    /* SECTION: file row */
    .file {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-top: 12px;
      padding: 20px;
      background: var(--surface);
      border: 1px solid var(--line);
      text-decoration: none;
      transition: border-color 0.16s var(--ease), background-color 0.16s var(--ease);
    }
    .file:hover { border-color: var(--line-strong); background: #f8faf7; }
    .file-name { display: block; font: 400 14px var(--mono); overflow-wrap: anywhere; }
    .file-meta { display: block; margin-top: 4px; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
    .file svg { width: 16px; height: 16px; stroke: var(--muted); stroke-width: 1.5; fill: none; flex: none; transition: stroke 0.16s var(--ease); }
    .file:hover svg { stroke: var(--green); }

    /* SECTION: aside */
    aside { padding-top: 4px; }
    .profile { padding: 24px; background: var(--surface); border: 1px solid var(--line); }
    .avatar {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: var(--green);
      color: #ffffff;
      font: 500 18px var(--mono);
      margin-bottom: 16px;
    }
    .profile h2 { font-size: 18px; margin-bottom: 8px; }
    .profile p { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; }
    .text-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--green);
      font-size: 14px;
      text-decoration: none;
      transition: color 0.16s var(--ease);
    }
    .side-block { margin-top: 32px; }
    .side-title { margin: 0 0 12px; color: var(--muted); font: 400 12px var(--mono); }
    .tags { margin: 0; padding: 0; list-style: none; }
    .tags li { display: inline-block; margin: 0 6px 8px 0; }
    .tag {
      display: inline-block;
      padding: 4px 8px;
      border: 1px solid var(--line);
      color: var(--ink-2);
      font: 400 12px var(--mono);
    }
    .side-list { list-style: none; padding: 0; margin: 0; font-size: 14px; }
    .side-list li { padding: 8px 0; border-bottom: 1px solid var(--line); }
    .side-list a { text-decoration: none; transition: color 0.16s var(--ease); }
    .side-list a:hover { color: var(--green); }

    /* SECTION: footer */
    footer {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 20px 0 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font: 400 12px var(--mono);
    }
    footer a { text-decoration: none; transition: color 0.16s var(--ease); }
    footer a:hover { color: var(--green); }

    /* SECTION: responsive */
    @media (max-width: 720px) {
      .shell { padding: 0 20px; }
      header { padding: 20px 0; }
      nav { gap: 16px; }
      .layout { grid-template-columns: 1fr; gap: 48px; padding: 44px 0 64px; }
      .intro { margin-bottom: 36px; }
      aside { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
      .profile { grid-column: 1 / -1; }
      .side-block { margin-top: 0; }
    }
    @media (max-width: 420px) {
      .shell { padding: 0 16px; }
      nav { gap: 12px; font-size: 13px; }
      aside { grid-template-columns: 1fr; }
      .profile { grid-column: auto; }
      footer { flex-direction: column; gap: 8px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after {
        transition-duration: 0.01ms !important;
        animation-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <!-- SECTION: top -->
  <div class="site-line"></div>
  <div class="shell">
    <header>
      <a class="brand" href="./">jjbwxw<span>.</span></a>
      <nav aria-label="主导航">
        <a href="#journal">日志</a>
        <a href="#downloads">下载</a>
        <a href="https://github.com/jjbwxw" target="_blank" rel="noopener noreferrer">GitHub<svg class="ext" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
      </nav>
    </header>

    <main class="layout">
      <div>
        <!-- SECTION: hero -->
        <section class="hero" aria-labelledby="page-title">
          <p class="eyebrow">Personal notes · 个人记录</p>
          <h1 id="page-title">jjbwxw 的随手记</h1>
          <p class="intro">记录正在做的东西，分享值得留下的文件。一个慢慢生长的个人角落。</p>
        </section>

        <!-- SECTION: journal -->
        <section id="journal" aria-labelledby="journal-title">
          <div class="section-head">
            <h2 id="journal-title">最近记录</h2>
            <span class="section-note">0 篇</span>
          </div>
          <div class="empty">
            <p>还没有文章。</p>
            <p class="small">项目进展和新想法会先写在这里。</p>
          </div>
        </section>

        <!-- SECTION: downloads -->
        <section class="download" id="downloads" aria-labelledby="download-title">
          <div class="section-head">
            <h2 id="download-title">文件下载</h2>
            <span class="section-note" id="filesCount">读取中</span>
          </div>
          <div id="fileList" class="files-state">正在从仓库读取文件列表。</div>
        </section>
      </div>

      <!-- SECTION: aside -->
      <aside aria-label="关于与导航">
        <section class="profile">
          <div class="avatar" aria-hidden="true">J</div>
          <h2>关于我</h2>
          <p>这里放个人记录、项目和可下载文件。</p>
          <a class="text-link" href="https://github.com/jjbwxw" target="_blank" rel="noopener noreferrer">GitHub 主页<svg class="ext" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg></a>
        </section>
        <section class="side-block">
          <h3 class="side-title">此站内容</h3>
          <ul class="tags">
            <li><span class="tag">随手记</span></li>
            <li><span class="tag">项目</span></li>
            <li><span class="tag">下载</span></li>
          </ul>
        </section>
        <section class="side-block">
          <h3 class="side-title">站点导航</h3>
          <ul class="side-list">
            <li><a href="#journal">最近记录</a></li>
            <li><a href="#downloads">文件下载</a></li>
            <li><a href="admin.html">管理入口</a></li>
          </ul>
        </section>
      </aside>
    </main>

    <!-- SECTION: footer -->
    <footer>
      <span>© 2026 jjbwxw · 用 GitHub Pages 发布</span>
      <a href="https://github.com/jjbwxw" target="_blank" rel="noopener noreferrer">Source</a>
    </footer>
  </div>

  <script>
    /* SECTION: files from repo */
    var REPO = "jjbwxw/jjbwxw.github.io";
    var DIR = "downloads";
    var listBox = document.getElementById("fileList");
    var countBox = document.getElementById("filesCount");
    var ROW_TPL = '<a class="file" download><span><span class="file-name"></span><span class="file-meta"></span></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11M7 11l5 5 5-5M4 20h16"/></svg>';
    var STATE_TPL = '<p class="file-meta"></p>';

    function setState(text, withRepoLink) {
      listBox.className = "files-state";
      listBox.textContent = "";
      var p = document.createElement("template");
      p.innerHTML = STATE_TPL;
      var node = p.content.firstChild;
      node.textContent = text;
      listBox.appendChild(node);
      if (withRepoLink) {
        var box = document.createElement("template");
        box.innerHTML = '<a class="text-link" target="_blank" rel="noopener noreferrer"></a>';
        var link = box.content.firstChild;
        link.textContent = "去仓库查看";
        link.href = "https://github.com/" + REPO + "/tree/main/" + DIR;
        listBox.appendChild(document.createTextNode(" "));
        listBox.appendChild(link);
      }
    }

    function fmtSize(bytes) {
      if (bytes < 1024) return bytes + " B";
      if (bytes < 1048576) return (bytes / 1024).toFixed(0) + " KB";
      if (bytes < 1073741824) return (bytes / 1048576).toFixed(1) + " MB";
      return (bytes / 1073741824).toFixed(1) + " GB";
    }

    function render(files) {
      listBox.className = "";
      listBox.textContent = "";
      if (!files.length) {
        setState("这个目录还没有文件。", false);
        countBox.textContent = "0 个文件";
        return;
      }
      files.forEach(function (f) {
        var tpl = document.createElement("template");
        tpl.innerHTML = ROW_TPL;
        var row = tpl.content.firstChild;
        row.href = "downloads/" + encodeURIComponent(f.name);
        row.querySelector(".file-name").textContent = f.name;
        row.querySelector(".file-meta").textContent = fmtSize(f.size);
        listBox.appendChild(row);
      });
      countBox.textContent = files.length + " 个文件";
    }

    function loadFiles() {
      var api = "https://api.github.com/repos/" + REPO + "/contents/" + DIR;
      fetch(api, { headers: { Accept: "application/vnd.github+json" }, cache: "no-store" })
        .then(function (res) {
          if (!res.ok) throw new Error("status " + res.status);
          return res.json();
        })
        .then(function (data) {
          var files = (Array.isArray(data) ? data : [])
            .filter(function (item) { return item.type === "file"; })
            .sort(function (a, b) { return a.name < b.name ? -1 : 1; });
          render(files);
        })
        .catch(function () {
          countBox.textContent = "未同步";
          setState("暂时读不到仓库的文件列表。", true);
        });
    }

    loadFiles();
  </script>
</body>
</html>
