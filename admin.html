<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理区 - jjbwxw</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>管理区 - jjbwxw</title>
  <style>
    /* 配色与主页 index.html 对齐，另加自动深色模式 */
    :root {
      color-scheme: light dark;
      --paper: #f4f6f3;
      --surface: #ffffff;
      --ink: #20332f;
      --ink-2: #596962;
      --muted: #616e67;
      --line: rgba(32, 51, 47, 0.09);
      --line-strong: rgba(32, 51, 47, 0.16);
      --green: #176b52;
      --danger: #b3423a;
      --sans: "Segoe UI", "Microsoft YaHei", sans-serif;
      --mono: "Cascadia Code", "SFMono-Regular", Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #161d1a;
        --surface: #1e2724;
        --ink: #e6ebe8;
        --ink-2: #a9b5af;
        --muted: #8b978f;
        --line: rgba(230, 235, 232, 0.10);
        --line-strong: rgba(230, 235, 232, 0.20);
        --green: #5db994;
        --danger: #e28d85;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
      line-height: 1.7;
    }
    .site-line { height: 4px; background: var(--green); }
    .shell { max-width: 640px; margin: 0 auto; padding: 0 20px; }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 0;
      border-bottom: 1px solid var(--line);
    }
    .brand { font: 500 16px/1 var(--mono); text-decoration: none; color: inherit; }
    .brand span { color: var(--green); }
    main { padding: 48px 0 72px; }
    h1 { margin: 0 0 8px; font: 500 32px/1.25 var(--sans); }
    .intro { color: var(--ink-2); margin: 0 0 20px; }
    .gate { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
    .pwd-wrap { position: relative; flex: 1 1 240px; }
    input[type=password], input[type=text] {
      width: 100%;
      font: 16px var(--sans);
      padding: 10px 64px 10px 12px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink);
    }
    input:focus-visible { outline: 2px solid var(--green); outline-offset: 0; }
    .eye {
      position: absolute;
      right: 4px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: none;
      color: var(--muted);
      cursor: pointer;
      font: 13px var(--mono);
      padding: 6px 10px;
      border-radius: 6px;
    }
    .eye:hover { color: var(--green); background: var(--line); }
    button.act {
      font: 14px var(--sans);
      padding: 10px 18px;
      border: 1px solid var(--ink);
      border-radius: 8px;
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
    }
    button.act:hover { opacity: 0.85; }
    button.act:disabled {
      background: var(--line-strong);
      border-color: transparent;
      color: var(--muted);
      cursor: not-allowed;
    }
    button.ghost {
      font: 13px var(--sans);
      padding: 8px 14px;
      border: 1px solid var(--line-strong);
      border-radius: 8px;
      background: var(--surface);
      color: var(--ink-2);
      cursor: pointer;
    }
    button.ghost:hover { color: var(--green); border-color: var(--green); }
    #msg { font-size: 14px; color: var(--ink-2); margin-top: 12px; min-height: 1.5em; }
    #msg.bad { color: var(--danger); }
    #content {
      margin-top: 20px;
      white-space: pre-wrap;
      word-break: break-all;
      font: 14px/1.7 var(--mono);
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 16px;
    }
    .content-bar { margin-top: 10px; display: flex; gap: 8px; }
    .content-bar[hidden] { display: none; }
    #filesSection { margin-top: 32px; }
    #filesSection h2 { margin: 0 0 4px; font: 500 18px/1.3 var(--sans); }
    .files-intro { color: var(--ink-2); font-size: 13px; margin: 0 0 10px; }
    .file-list { display: flex; flex-direction: column; gap: 8px; }
    .file-item {
      display: flex; align-items: center; justify-content: space-between;
      gap: 10px; padding: 10px 14px;
      background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
    }
    .file-meta { min-width: 0; }
    .file-name { font: 14px var(--mono); word-break: break-all; }
    .file-size { font-size: 12px; color: var(--muted); }
    #filesMsg { font-size: 13px; color: var(--ink-2); margin-top: 8px; min-height: 1.4em; }
    #filesMsg.bad { color: var(--danger); }
    a.back { font-size: 13px; color: var(--muted); text-decoration: none; }
    a.back:hover { color: var(--green); }
  </style>
</head>
<body>
  <div class="site-line"></div>
  <div class="shell">
    <header>
      <a class="brand" href="./">jjbwxw<span>&thinsp;/&thinsp;admin</span></a>
      <a class="back" href="./">返回主页</a>
    </header>
    <main>
      <h1>管理区</h1>
      <p class="intro">输入密码解锁。解密在你的浏览器里完成，内容不会被上传。</p>

      <div class="gate">
        <div class="pwd-wrap">
          <input type="password" id="pwd" placeholder="密码" autocomplete="off" enterkeyhint="go">
          <button class="eye" id="eye" type="button" title="显示 / 隐藏密码">显示</button>
        </div>
        <button class="act" id="unlock">解锁</button>
      </div>
      <div id="msg"></div>
      <div id="content" hidden></div>
      <div class="content-bar" id="contentBar" hidden>
        <button class="ghost" id="copy" type="button">复制</button>
        <button class="ghost" id="relock" type="button">重新锁定</button>
      </div>

      <div id="filesSection" hidden>
        <h2>加密文件</h2>
        <p class="files-intro">同样在浏览器里解密，点击下载拿到的就是原文件。</p>
        <div class="file-list" id="fileList"></div>
        <div id="filesMsg"></div>
      </div>
    </main>
  </div>

<script>
// 加密参数（由本地工具生成，与密文配套）
function fromBase64(value) {
  return Uint8Array.from(atob(value), (char) => char.charCodeAt(0));
}

const SALT = fromBase64('ZZPw9poD5i/0mxC4PsyPEA==');
const IV = fromBase64('xQ2Q30oM/Sj4pfSb');
const CIPHER = fromBase64('yGL9aGrwSfaPzmgTFOOkdWDz5btAun3SFNQpeg1bKaLBluxiJilR3OWRoWNUrbs9zazAesGFvTQuMnI3rTP5HGMGxmXQp02VkW+owMJENlE2VAWjGQBky8nTr3haTIdiMN3NAfpHy62K16uKCdXY3G8RLu/eGGuvC7HUnQv7VdDNekFJ0BT5');
const ITERATIONS = 310000;

const enc = new TextEncoder();
const dec = new TextDecoder();
const pwdInput = document.getElementById('pwd');
const unlockBtn = document.getElementById('unlock');
const msgEl = document.getElementById('msg');
const contentEl = document.getElementById('content');
const eyeBtn = document.getElementById('eye');
const copyBtn = document.getElementById('copy');
const relockBtn = document.getElementById('relock');
const contentBar = document.getElementById('contentBar');
let plainText = '';

// SECTION: 加密文件库
const filesSection = document.getElementById('filesSection');
const fileList = document.getElementById('fileList');
const filesMsg = document.getElementById('filesMsg');
let fileKey = null;
const fileURLs = []; // 下载时创建的 Blob URL，重新锁定时统一撤销

function humanSize(n) {
  if (n < 1024) return n + ' B';
  if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
  return (n / 1024 / 1024).toFixed(2) + ' MB';
}

async function loadFileVault(password) {
  fileKey = null;
  filesSection.hidden = true;
  fileList.textContent = '';
  filesMsg.textContent = '';
  filesMsg.classList.remove('bad');
  let index;
  try {
    const res = await fetch('private/index.json', { cache: 'no-store' });
    if (res.status === 404) return; // 还没有文件库，整个区块不显示
    if (!res.ok) throw new Error('index');
    index = await res.json();
  } catch (e) { return; }
  filesSection.hidden = false;
  try {
    // 与 encfile.mjs 同一套派生方式：密码 + 清单 salt → AES-GCM 密钥
    const base = await crypto.subtle.importKey(
      'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
    );
    const key = await crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt: fromBase64(index.manifest.salt), iterations: index.manifest.iterations || 310000, hash: 'SHA-256' },
      base,
      { name: 'AES-GCM', length: 256 },
      false,
      ['decrypt']
    );
    const mRes = await fetch('private/' + index.manifest.file, { cache: 'no-store' });
    if (!mRes.ok) throw new Error('manifest');
    const mRaw = await mRes.arrayBuffer();
    const manifest = JSON.parse(dec.decode(await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: fromBase64(index.manifest.iv) }, key, mRaw
    )));
    fileKey = key;
    renderFiles(manifest.files || []);
  } catch (e) {
    filesMsg.textContent = '加密清单与这个密码不配套，无法列出文件。';
    filesMsg.classList.add('bad');
  }
}

function renderFiles(files) {
  fileList.textContent = '';
  if (!files.length) {
    filesMsg.textContent = '文件库还是空的。';
    return;
  }
  filesMsg.textContent = '';
  for (const f of files) {
    const item = document.createElement('div');
    item.className = 'file-item';
    const meta = document.createElement('div');
    meta.className = 'file-meta';
    const nm = document.createElement('div');
    nm.className = 'file-name';
    nm.textContent = f.name;
    const sz = document.createElement('div');
    sz.className = 'file-size';
    sz.textContent = humanSize(f.size);
    meta.append(nm, sz);
    const btn = document.createElement('button');
    btn.className = 'ghost';
    btn.type = 'button';
    btn.textContent = '下载';
    btn.addEventListener('click', () => downloadFile(f, btn));
    item.append(meta, btn);
    fileList.append(item);
  }
}

async function downloadFile(f, btn) {
  if (!fileKey) return;
  btn.disabled = true;
  try {
    const res = await fetch('private/' + f.path, { cache: 'no-store' });
    if (!res.ok) throw new Error('fetch');
    const pt = await crypto.subtle.decrypt(
      { name: 'AES-GCM', iv: fromBase64(f.iv) },
      fileKey,
      await res.arrayBuffer()
    );
    const url = URL.createObjectURL(new Blob([pt], { type: f.mime || 'application/octet-stream' }));
    fileURLs.push(url);
    const a = document.createElement('a');
    a.href = url;
    a.download = f.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    filesMsg.textContent = '已开始下载：' + f.name;
    filesMsg.classList.remove('bad');
  } catch (e) {
    filesMsg.textContent = '解密失败，文件可能损坏或与清单不配套。';
    filesMsg.classList.add('bad');
  } finally {
    btn.disabled = false;
  }
}

// 重新锁定 / 解锁失败时清空文件库状态（密钥、列表、Blob URL）
function clearFileVault() {
  fileKey = null;
  fileURLs.forEach((u) => URL.revokeObjectURL(u));
  fileURLs.length = 0;
  fileList.textContent = '';
  filesMsg.textContent = '';
  filesMsg.classList.remove('bad');
  filesSection.hidden = true;
}

function overlay() {
  unlockBtn.disabled = true;
  unlockBtn.textContent = '解密中…';
}

function release() {
  unlockBtn.disabled = false;
  unlockBtn.textContent = '解锁';
  pwdInput.disabled = false;
}

// SECTION: guard
const STORE_KEY = 'jjbwxw.admin.guard';
const FREE_ATTEMPTS = 3;
const BASE_LOCK_MS = 30000;
const MAX_LOCK_MS = 900000;

const guard = readGuard();
let timer = null;

function readGuard() {
  try {
    const raw = JSON.parse(localStorage.getItem(STORE_KEY) || '{}');
    return { fails: Number(raw.fails) || 0, until: Number(raw.until) || 0 };
  } catch (e) {
    return { fails: 0, until: 0 };
  }
}

function saveGuard() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(guard)); } catch (e) {}
}

function lockMs(fails) {
  const over = Math.max(fails - FREE_ATTEMPTS, 0);
  return Math.min(BASE_LOCK_MS * Math.pow(2, over), MAX_LOCK_MS);
}

function locked() {
  return guard.until > Date.now();
}

function secs(ms) {
  const t = Math.max(Math.ceil(ms / 1000), 1);
  return t < 60 ? t + ' 秒' : Math.floor(t / 60) + ' 分 ' + (t % 60) + ' 秒';
}

function paintLock() {
  unlockBtn.disabled = true;
  pwdInput.disabled = true;
  unlockBtn.textContent = '已锁定';
  contentEl.hidden = true;
  contentBar.hidden = true;
  clearFileVault();
  msgEl.textContent = '尝试次数过多，请在 ' + secs(guard.until - Date.now()) + ' 后重试。';
  msgEl.classList.add('bad');
}

function ready() {
  clearInterval(timer);
  timer = null;
  release();
}

function startCountdown() {
  clearInterval(timer);
  timer = null;
  if (!locked()) return;
  paintLock();
  timer = setInterval(() => {
    if (locked()) { paintLock(); return; }
    ready();
    msgEl.textContent = '锁定已解除，可以继续尝试。';
    msgEl.classList.remove('bad');
  }, 1000);
}

async function decrypt(password) {
  // 1. PBKDF2 派生密钥
  const baseKey = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']
  );
  const key = await crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: SALT, iterations: ITERATIONS, hash: 'SHA-256' },
    baseKey,
    { name: 'AES-GCM', length: 256 },
    false,
    ['decrypt']
  );
  // 2. AES-GCM 解密
  const pt = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: IV }, key, CIPHER);
  return dec.decode(pt);
}

unlockBtn.addEventListener('click', async () => {
  if (locked()) { paintLock(); return; }
  const pwd = pwdInput.value;
  if (!pwd) { msgEl.textContent = '请输入密码'; return; }
  msgEl.textContent = '';
  overlay();
  try {
    const text = await decrypt(pwd);
    plainText = text;
    contentEl.textContent = text;
    contentEl.hidden = false;
    contentBar.hidden = false;
    msgEl.textContent = '';
    msgEl.classList.remove('bad');
    pwdInput.value = '';
    guard.fails = 0;
    guard.until = 0;
    saveGuard();
    loadFileVault(pwd); // 文件库用同一个密码，加载不阻塞主流程
  } catch (e) {
    contentEl.hidden = true;
    contentBar.hidden = true;
    plainText = '';
    clearFileVault();
    pwdInput.value = '';
    guard.fails += 1;
    const wait = lockMs(guard.fails);
    if (locked()) { startCountdown(); return; }
    if (guard.fails >= FREE_ATTEMPTS) {
      guard.until = Date.now() + wait;
      saveGuard();
      startCountdown();
      return;
    }
    saveGuard();
    msgEl.textContent = '密码错误，无法解密。还可免费尝试 ' + (FREE_ATTEMPTS - guard.fails) + ' 次。';
    msgEl.classList.add('bad');
  } finally {
    if (!locked()) ready();
  }
});

// 密码显示/隐藏切换
eyeBtn.addEventListener('click', () => {
  const show = pwdInput.type === 'password';
  pwdInput.type = show ? 'text' : 'password';
  eyeBtn.textContent = show ? '隐藏' : '显示';
});

// 一键复制已解锁的内容（clipboard 不可用时退回 execCommand）
copyBtn.addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(plainText);
    msgEl.textContent = '已复制到剪贴板。';
  } catch (e) {
    const ta = document.createElement('textarea');
    ta.value = plainText;
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e2) { }
    ta.remove();
    msgEl.textContent = ok ? '已复制到剪贴板。' : '复制失败，请手动选择文本复制。';
  }
});

// 重新锁定：清掉明文和输入框，回到未解锁状态（防爆破计数保持已清零）
relockBtn.addEventListener('click', () => {
  plainText = '';
  contentEl.textContent = '';
  contentEl.hidden = true;
  contentBar.hidden = true;
  clearFileVault();
  pwdInput.value = '';
  pwdInput.type = 'password';
  eyeBtn.textContent = '显示';
  msgEl.textContent = '已重新锁定。';
  pwdInput.focus();
});

pwdInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') unlockBtn.click(); });
startCountdown();
pwdInput.focus();
</script>
</body>
</html>
